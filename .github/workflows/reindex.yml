name: reindex

on:
  push:
    paths:
      - "src/fixtures/**"
      - "src/lib/odm/**"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --experimental-strip-types --test src/lib/odm/pipeline.test.ts
      - run: node --experimental-strip-types src/lib/odm/cli.ts src/fixtures/miniloan rulebase.json
